name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to mint an id-token to publish to Pages; nothing here
# needs write access to the repository contents.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait for the one in flight rather than race it, but
# superseded builds are not worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      # vite.config.js sets `base: './'`, so the bundle resolves its own assets
      # relative to index.html and works unchanged under a /<repo>/ path.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
